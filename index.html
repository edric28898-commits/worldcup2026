<style>
:root {
  --gold: #F5C518;
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1e2531;
  --border: rgba(255,255,255,0.08);
  --text: #e6edf3;
  --muted: #8b949e;
  --live: #ff4545;
  --blue: #4d9ef5;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.header {
  background: linear-gradient(135deg, #0d1117 0%, #1a2a1a 50%, #0d1117 100%);
  border-bottom: 1px solid var(--border);
  padding: 20px 16px 16px;
  text-align: center;
}
.trophy { font-size:40px; display:block; margin-bottom:6px; animation: bob 4s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.header h1 { font-family:'Bebas Neue',sans-serif; font-size:2.6rem; letter-spacing:3px; color:var(--gold); text-shadow:0 0 30px rgba(245,197,24,0.4); }
.header p { color:var(--muted); font-size:0.8rem; letter-spacing:2px; text-transform:uppercase; margin-top:4px; }

#countdown-banner {
  background: linear-gradient(135deg, rgba(245,197,24,0.1), rgba(245,197,24,0.04));
  border: 1px solid rgba(245,197,24,0.2);
  border-radius:12px; margin:12px 16px 0; padding:12px 16px;
  display:none; text-align:center;
}
#countdown-banner.show { display:block; }
.cd-label { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:4px; }
.cd-match { font-size:0.9rem; font-weight:600; margin-bottom:6px; }
.cd-match b { color:var(--gold); }
.cd-time { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:3px; color:var(--gold); }

#live-banner {
  background: rgba(255,69,69,0.1);
  border: 1px solid rgba(255,69,69,0.25);
  border-radius:12px; margin:12px 16px 0; padding:12px 16px;
  display:none; text-align:center;
}
#live-banner.show { display:block; }
.live-dot { display:inline-block; width:7px; height:7px; background:var(--live); border-radius:50%; margin-right:5px; animation:pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.live-label { font-size:0.68rem; color:var(--live); text-transform:uppercase; letter-spacing:1.5px; }
.live-match { font-size:0.9rem; font-weight:600; margin-top:4px; }

.date-nav { padding:14px 16px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.date-nav::-webkit-scrollbar { display:none; }
.date-inner { display:flex; gap:8px; padding-bottom:2px; width:max-content; }
.date-btn {
  flex-shrink:0; padding:8px 14px; border:1px solid var(--border);
  border-radius:8px; background:var(--surface); color:var(--muted);
  cursor:pointer; font-family:'DM Sans',sans-serif; font-size:0.78rem;
  font-weight:500; transition:all 0.2s; text-align:center; min-width:62px;
}
.date-btn .dn { font-size:1.1rem; font-weight:700; color:var(--text); display:block; line-height:1.2; }
.date-btn .dm { font-size:0.62rem; text-transform:uppercase; letter-spacing:1px; }
.date-btn.active { background:var(--gold); border-color:var(--gold); color:#000; box-shadow:0 4px 16px rgba(245,197,24,0.3); }
.date-btn.active .dn { color:#000; }
.date-btn.active .dm { color:#444; }
.date-btn.has-live { border-color:rgba(255,69,69,0.5); }
.date-btn.past .dn { color:var(--muted); }

.match-list { padding:14px 16px 80px; }
.day-section { display:none; }
.day-section.active { display:block; animation:slideUp 0.3s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.stage-header {
  font-family:'Bebas Neue',sans-serif; font-size:0.85rem; letter-spacing:2px;
  color:var(--muted); text-transform:uppercase; padding:6px 0 10px;
  display:flex; align-items:center; gap:8px;
}
.stage-header::after { content:''; flex:1; height:1px; background:var(--border); }

.match-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; margin-bottom:10px; padding:14px 16px;
  position:relative; overflow:hidden; transition:border-color 0.2s;
}
.match-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0;
  width:3px; border-radius:3px 0 0 3px; background:transparent;
}
.match-card.is-live { border-color:rgba(255,69,69,0.35); }
.match-card.is-live::before { background:var(--live); }
.match-card.is-next { border-color:rgba(245,197,24,0.3); }
.match-card.is-next::before { background:var(--gold); }
.match-card.is-done { opacity:0.5; }

.match-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.grp-badge { font-size:0.62rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); background:var(--surface2); padding:2px 8px; border-radius:4px; }
.time-vn { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:1px; color:var(--gold); line-height:1; text-align:right; }
.time-et { font-size:0.62rem; color:var(--muted); text-align:right; margin-top:1px; }

.teams { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.team-home, .team-away { flex:1; display:flex; align-items:center; gap:7px; }
.team-away { flex-direction:row-reverse; text-align:right; }
.flag { font-size:1.5rem; line-height:1; flex-shrink:0; }
.tname { font-size:0.85rem; font-weight:600; line-height:1.25; }

.score-mid { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.sc { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; min-width:20px; text-align:center; line-height:1; }
.sc-sep { color:var(--muted); font-size:1rem; }
.sc-vs { color:var(--muted); font-size:0.72rem; font-weight:600; letter-spacing:1px; }

.match-bot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
.status-badge { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:2px 8px; border-radius:4px; display:inline-flex; align-items:center; gap:4px; }
.sb-live { background:rgba(255,69,69,0.18); color:var(--live); }
.sb-done { background:rgba(255,255,255,0.05); color:var(--muted); }
.sb-up { background:rgba(77,158,245,0.12); color:var(--blue); }
.venue { font-size:0.65rem; color:var(--muted); }

#now-btn {
  position:fixed; bottom:24px; right:20px; width:48px; height:48px;
  border-radius:50%; background:var(--gold); color:#000; border:none;
  cursor:pointer; font-family:'Bebas Neue',sans-serif; font-size:0.8rem;
  letter-spacing:1px; box-shadow:0 4px 20px rgba(245,197,24,0.4);
  display:none; z-index:100; align-items:center; justify-content:center;
}
#now-btn.show { display:flex; }
</style>

function fmt2(n) { return n < 10 ? "0"+n : ""+n; }

function formatVN(iso) {
  var d = vnTime(iso);
  return fmt2(d.getUTCHours()) + ":" + fmt2(d.getUTCMinutes());
}

function formatET(iso) {
  var d = new Date(new Date(iso).getTime() - 4*3600000);
  var h = d.getUTCHours(), m = d.getUTCMinutes();
  var ap = h>=12?"PM":"AM"; h = h%12||12;
  return h+":"+fmt2(m)+" "+ap+" ET";
}

  var matches = dayMap[day];
  var parts = day.split("-");
  var d_obj = new Date(day+"T12:00:00Z");
  var dname = DAY_NAMES[d_obj.getUTCDay()];
  var dd_num = parseInt(parts[2]);
  var mo_num = parseInt(parts[1]);

  var hasLive = false;
  var allDone = true;
  for (var mi=0; mi<matches.length; mi++) {
    var st = matchStatus(M[matches[mi]][0]);
    if (st === "live") hasLive = true;
    if (st !== "done") allDone = false;
  }

  // date button
  var btn = document.createElement("button");
  btn.className = "date-btn" + (hasLive?" has-live":"") + (allDone?" past":"");
  btn.dataset.day = day;
  btn.innerHTML = '<span class="dn">'+dd_num+'</span><span class="dm">'+dname+' T'+mo_num+'</span>';
  btn.onclick = (function(d){ return function(){ switchDay(d); }; })(day);
  dateInner.appendChild(btn);

  // section
  var sec = document.createElement("div");
  sec.className = "day-section";
  sec.id = "day-"+day;

  var lastStage = null;
  for (var mi=0; mi<matches.length; mi++) {
    var idx = matches[mi];
    var m = M[idx];
    var iso=m[0], grp=m[1], home=m[2], hCode=m[3], away=m[4], aCode=m[5], venue=m[6], city=m[7];
    var status = matchStatus(iso);

    if (grp !== lastStage) {
      var sh = document.createElement("div");
      sh.className = "stage-header";
      sh.textContent = STAGE_LABELS[grp] || grp;
      sec.appendChild(sh);
      lastStage = grp;
    }

    var sc = SCORES[iso];
    var scoreHTML;
    if (sc) {
      scoreHTML = '<span class="sc">'+sc[0]+'</span><span class="sc-sep">:</span><span class="sc">'+sc[1]+'</span>';
    } else {
      scoreHTML = '<span class="sc-vs">VS</span>';
    }

    var sbClass, sbText;
    if (status==="live") { sbClass="sb-live"; sbText='<span class="live-dot" style="width:6px;height:6px;display:inline-block;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite;margin-right:3px;"></span>Dang da'; }
    else if (status==="done") { sbClass="sb-done"; sbText="&#10003; Ket thuc"; }
    else { sbClass="sb-up"; sbText="Sap dau"; }

    var card = document.createElement("div");
    card.className = "match-card" + (status==="live"?" is-live":status==="done"?" is-done":"");
    card.dataset.iso = iso;
    card.innerHTML =
      '<div class="match-top">'+
        '<span class="grp-badge">'+(STAGE_LABELS[grp]||grp)+'</span>'+
        '<div><div class="time-vn">'+formatVN(iso)+' <span style="font-size:0.62rem;opacity:0.6">ICT</span></div>'+
        '<div class="time-et">'+formatET(iso)+'</div></div>'+
      '</div>'+
      '<div class="teams">'+
        '<div class="team-home">'+flagImg(hCode)+'<span class="tname">'+home+'</span></div>'+
        '<div class="score-mid">'+scoreHTML+'</div>'+
        '<div class="team-away"><span class="tname">'+away+'</span>'+flagImg(aCode)+'</div>'+
      '</div>'+
      '<div class="match-bot">'+
        '<span class="status-badge '+sbClass+'">'+sbText+'</span>'+
        '<span class="venue">'+venue+', '+city+'</span>'+
      '</div>';
    sec.appendChild(card);
  }
  matchList.appendChild(sec);
}

// Switch day
var activeDay = null;
function switchDay(day) {
  var secs = document.querySelectorAll(".day-section");
  for (var i=0; i<secs.length; i++) secs[i].classList.remove("active");
  var btns = document.querySelectorAll(".date-btn");
  for (var i=0; i<btns.length; i++) btns[i].classList.remove("active");
  var sec = document.getElementById("day-"+day);
  var btn = document.querySelector('[data-day="'+day+'"]');
  if (sec) sec.classList.add("active");
  if (btn) { btn.classList.add("active"); btn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}); }
  activeDay = day;
}

// Auto select today / next upcoming
function autoSelect() {
  var now = new Date(Date.now() + 7*3600000);
  var todayKey = now.getUTCFullYear()+"-"+fmt2(now.getUTCMonth()+1)+"-"+fmt2(now.getUTCDate());
  if (dayMap[todayKey]) { switchDay(todayKey); return; }
  for (var i=0; i<dayOrder.length; i++) {
    var ms = dayMap[dayOrder[i]];
    for (var j=0; j<ms.length; j++) {
      if (matchStatus(M[ms[j]][0]) !== "done") { switchDay(dayOrder[i]); return; }
    }
  }
  switchDay(dayOrder[dayOrder.length-1]);
}

// Banners + countdown
function updateUI() {
  var now = Date.now();
  var liveM = null, nextM = null, nextT = Infinity;
  for (var i=0; i<M.length; i++) {
    var st = matchStatus(M[i][0]);
    var t = new Date(M[i][0]).getTime();
    if (st==="live" && !liveM) liveM = M[i];
    if (st==="upcoming" && t < nextT) { nextT=t; nextM=M[i]; }
  }
  var lb = document.getElementById("live-banner");
  var cb = document.getElementById("countdown-banner");
  var nb = document.getElementById("now-btn");
  if (liveM) {
    lb.classList.add("show"); cb.classList.remove("show"); nb.classList.add("show");
    document.getElementById("live-text").textContent = liveM[2]+" vs "+liveM[4];
  } else if (nextM) {
    lb.classList.remove("show"); cb.classList.add("show");
    document.getElementById("cd-match").innerHTML = "<b>"+nextM[2]+"</b> vs <b>"+nextM[4]+"</b>";
    var diff = nextT - now;
    if (diff < 0) diff = 0;
    var h = Math.floor(diff/3600000);
    var mn = Math.floor((diff%3600000)/60000);
    var sc = Math.floor((diff%60000)/1000);
    var txt = h>0 ? h+":"+fmt2(mn)+":"+fmt2(sc) : fmt2(mn)+":"+fmt2(sc);
    document.getElementById("cd-time").textContent = txt;
  } else {
    lb.classList.remove("show"); cb.classList.remove("show");
  }

  // mark next card
  var cards = document.querySelectorAll(".match-card.is-next");
  for (var i=0; i<cards.length; i++) cards[i].classList.remove("is-next");
  var found = false;
  var allCards = document.querySelectorAll(".match-card");
  for (var i=0; i<allCards.length; i++) {
    if (!found && matchStatus(allCards[i].dataset.iso)==="upcoming") {
      allCards[i].classList.add("is-next"); found=true;
    }
  }
}

function scrollNow() {
  var live = document.querySelector(".match-card.is-live");
  var next = document.querySelector(".match-card.is-next");
  var target = live || next;
  if (target) target.scrollIntoView({behavior:"smooth",block:"center"});
}

autoSelect();
updateUI();
setInterval(updateUI, 1000);
</script>
</body>
</html>
